name: PokeVault
options:
  bundleIdPrefix: com.pokevault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "16.0"
  projectFormat: xcode16_0
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  PokeVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: Providers
      - path: Persistence
      - path: Scanner
      - path: Collections
      - path: Statistics
      - path: Utilities
      - path: Resources
        buildPhase: resources
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokevault.collection
        PRODUCT_NAME: PokeVault
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_TESTABILITY: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: PokéVault
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: PokéVault benötigt die Kamera, um Karten zu scannen und zu digitalisieren.
        NSPhotoLibraryUsageDescription: PokéVault benötigt Zugriff auf Fotos, um Kartenbilder hinzuzufügen.
        UIAppFonts:
          - Fonts/PlusJakartaSans.ttf
  PokeVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PokeVaultTests
    dependencies:
      - target: PokeVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokevault.collection.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PokeVault.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PokeVault"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PokeVault:
    build:
      targets:
        PokeVault: all
        PokeVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PokeVaultTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
